<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SoundPair</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1E1E1E;
      color: #E0E0E0;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #FFF;
    }
    .status-card {
      background: #282828;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      margin-bottom: 8px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #9E9E9E;
    }
    .value {
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-online {
      background: rgba(46, 204, 113, 0.2);
      color: #2ECC71;
    }
    .badge-offline {
      background: rgba(231, 76, 60, 0.2);
      color: #E74C3C;
    }
    .highlight {
      color: #00A6FF;
      font-size: 15px;
    }
    .note {
      font-size: 11px;
      color: #777;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon48.png" width="20" height="20" style="vertical-align: middle;" alt="SoundPair">
    <h2>SoundPair</h2>
  </div>

  <div class="status-card">
    <div class="row">
      <span class="label">SoundPair App:</span>
      <span id="appStatus" class="badge badge-offline">Disconnected</span>
    </div>
    <div class="row">
      <span class="label">Streaming State:</span>
      <span id="streamState" class="value">Idle</span>
    </div>
    <div class="row">
      <span class="label">Video Delay:</span>
      <span id="offsetVal" class="value highlight">+0 ms</span>
    </div>
  </div>

  <div class="note">
    Auto-delays HTML5 video frames to perfectly match Bluetooth audio latency.
  </div>

  <script src="popup.js"></script>
</body>
</html>
